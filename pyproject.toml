[project]
name = "customer-signal-digest"
version = "0.1.0"
description = "A Claude skill that turns support tickets, call notes and NPS answers into ranked, evidenced, redacted opportunities."
requires-python = ">=3.9"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: syntax older than Python 3.9.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.isort]
# The scripts and the eval helpers are found through sys.path, so they sort as first-party.
known-first-party = ["cluster", "dedupe", "digest", "helpers", "rank", "redact", "signals", "validate"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert in class setup and write to a temporary directory.
"evals/**" = ["S101", "S108"]
